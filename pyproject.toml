[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "actionmail"
version = "1.0.0"
description = "Recipient-specific action review for work emails"
requires-python = ">=3.10"

[project.scripts]
actionmail = "actionmail.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
