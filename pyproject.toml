[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "actionmail"
version = "3.0.0.dev0"
description = "Recipient-specific action review for work emails"
requires-python = ">=3.10"
dependencies = ["pypdf>=6,<7"]

[project.scripts]
actionmail = "actionmail.interfaces.cli:main"
actionmail-eval = "actionmail.evaluation.cli:main"
actionmail-review = "actionmail.interfaces.review_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"actionmail.interfaces" = ["review_index.html", "review_style.css", "review_app.js"]
